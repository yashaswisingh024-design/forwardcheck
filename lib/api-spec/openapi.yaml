openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: verify
    description: Claim verification operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /verify:
    post:
      operationId: verifyClaim
      tags: [verify]
      summary: Verify a claim
      description: Searches live web evidence and uses Gemini to evaluate a claim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    VerifyRequest:
      type: object
      properties:
        claim:
          type: string
          minLength: 8
          maxLength: 1500
        language:
          type: string
          enum: [en, hi, mr, English, Hindi, Marathi]
          default: en
      required:
        - claim

    Source:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        url:
          type: string
        snippet:
          type: string
        source:
          type: string
        date:
          type: string
        kind:
          type: string
          enum: [official, fact-check, news, web]
      required:
        - id
        - title
        - url
        - snippet
        - source
        - kind

    EvidenceItem:
      type: object
      properties:
        sourceId:
          type: string
        stance:
          type: string
          enum: [supports, contradicts, context]
        point:
          type: string
      required:
        - sourceId
        - stance
        - point

    VerifyResponse:
      type: object
      properties:
        verdict:
          type: string
          enum: [Supported, Debunked, Mixed, Unverified, Insufficient Evidence]
        confidence:
          type: integer
          minimum: 0
          maximum: 100
        summary:
          type: string
        why:
          type: array
          items:
            type: string
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceItem"
        correction:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Source"
      required:
        - verdict
        - confidence
        - summary
        - why
        - evidence
        - correction
        - sources

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
